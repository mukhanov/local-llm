[project]
name = "local-llm"
version = "0.1.0"
description = "One command to run a local LLM on your Mac: model picker, MLX server, OpenAI + Anthropic APIs, Claude Code integration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # MLX server (OpenAI API) — pulls in mlx/mlx-metal for the current chip
    "mlx-lm>=0.25",
    # snapshot_download, HF API; targets the hub 1.x cache layout
    "huggingface-hub>=1.0",
    # monitor: per-core CPU, process RSS
    "psutil>=5.9",
]

[project.scripts]
local-llm = "local_llm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["local_llm"]
