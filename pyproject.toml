[project]
name = "local-llm"
dynamic = ["version"]
description = "One command to run a local LLM on your Mac: model picker, MLX server, OpenAI + Anthropic APIs, Claude Code integration"
readme = {text = "One command to run a local LLM on your Mac: a model picker ranked for your RAM, MLX or llama.cpp serving, OpenAI and Anthropic APIs on localhost, client config for pi / omp / Claude Code. https://github.com/mukhanov/local-llm", content-type = "text/plain"}
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # MLX server (OpenAI API) — pulls in mlx/mlx-metal for the current chip
    "mlx-lm>=0.25",
    # snapshot_download, HF API; targets the hub 1.x cache layout. transformers
    # 5.x already forbids 2.x (httpx2 rewrite); the cap keeps it explicit if
    # that ever changes — hf.py scans blobs/ and .incomplete files directly.
    "huggingface-hub>=1.0,<2.0",
    # monitor: per-core CPU, process RSS
    "psutil>=5.9",
]

[project.scripts]
local-llm = "local_llm.cli:main"

[project.urls]
Homepage = "https://github.com/mukhanov/local-llm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "local_llm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["local_llm"]
